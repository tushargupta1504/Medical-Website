<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swasthya Point</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar bg-dark p-3">
    <div class="logo">
        <img src="./img/swasthya-logo.png" height="50">
    </div>

    <ul class="nav-list d-flex gap-3 list-unstyled text-white m-0">
        <li><a href="#home" class="text-white">Home</a></li>
        <li><a href="#about" class="text-white">About</a></li>
        <li><a href="#services" class="text-white">Services</a></li>
        <li><a href="#contact" class="text-white">Contact</a></li>
    </ul>
</nav>

<!-- HOME -->
<section id="home" class="p-5">
    <h1>Your Health, Our Priority</h1>
</section>

<!-- ABOUT + BMI -->
<section id="about" class="p-5">

    <h2>About Us</h2>

    <div class="row mt-4">
        <div class="col-md-6">
            <video src="img/about-video.mp4" autoplay muted loop class="w-100"></video>
        </div>

        <div class="col-md-6">
            <p>Welcome to Swasthya Point...</p>
        </div>
    </div>

    <!-- BMI MODULE -->
    <div class="mt-5 p-4 bg-light rounded">
        <h3>BMI Calculator</h3>

        <input type="number" id="weight" class="form-control mt-2" placeholder="Weight (kg)">
        <input type="number" id="height" class="form-control mt-2" placeholder="Height (cm)">

        <button class="btn btn-primary mt-3" onclick="calculateBMI()">Calculate</button>

        <h4 class="mt-3" id="result"></h4>
    </div>

</section>

<!-- SERVICES -->
<section id="services" class="p-5">
    <h2>Services</h2>
</section>

<!-- CONTACT -->
<section id="contact" class="p-5">
    <h2>Contact</h2>

    <input class="form-control mt-2" id="name" placeholder="Name">
    <input class="form-control mt-2" id="email" placeholder="Email">

    <button class="btn btn-dark mt-3" id="contactBtn">Send</button>
</section>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-4 mt-5">
    Swasthya Point © 2026
</footer>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// BMI
function calculateBMI() {
    let weight = parseFloat(document.getElementById("weight").value);
    let height = parseFloat(document.getElementById("height").value);

    height = height / 100;
    let bmi = weight / (height * height);

    let result = "";

    if (bmi < 18.5) result = "Underweight";
    else if (bmi < 25) result = "Normal";
    else if (bmi < 30) result = "Overweight";
    else result = "Obesity";

    document.getElementById("result").innerText =
        "BMI: " + bmi.toFixed(2) + " (" + result + ")";
}

// Contact reset (safe version)
document.getElementById("contactBtn").addEventListener("click", function () {
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    alert("Sent!");
});
</script>

</body>
</html>
